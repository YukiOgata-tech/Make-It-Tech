<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
  <title id="t">Googleの口コミで目指すべき基準値</title>
  <desc id="d">星評価は最低3.5・目標4.0以上、口コミ件数は最低10件・目標30件以上、鮮度は3ヶ月以内・月2から3件の継続投稿。</desc>
  <style>
    .bg { fill: #F7F3EA; }
    .card { fill: #FFFFFF; stroke: #E2D6C5; stroke-width: 1.5; }
    .h { font: 600 26px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #1C2C34; }
    .key { font: 600 16px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #5A6B73; }
    .big { font: 700 44px 'Outfit','Zen Kaku Gothic New',system-ui,sans-serif; fill: #E2673D; }
    .unit { font: 600 18px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #E2673D; }
    .minl { font: 400 14px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #5A6B73; }
    .minv { font: 600 14px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #1C2C34; }
    .badge { font: 600 12px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #FFFFFF; }
    .cap { font: 400 13px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #8A9299; }
  </style>
  <rect class="bg" width="800" height="340" rx="18"/>
  <text class="h" x="40" y="54">口コミで目指すべき3つの基準値</text>

  <rect class="card" x="40" y="80" width="230" height="190" rx="14"/>
  <rect x="56" y="98" width="66" height="22" rx="11" fill="#2A9D91"/>
  <text class="badge" x="89" y="113" text-anchor="middle">星評価</text>
  <text class="key" x="56" y="146">目標</text>
  <text class="big" x="56" y="192">4.0</text>
  <text class="unit" x="128" y="192">以上</text>
  <line x1="56" y1="212" x2="254" y2="212" stroke="#E2D6C5" stroke-width="1.5"/>
  <text class="minl" x="56" y="238">最低ライン</text>
  <text class="minv" x="56" y="260">3.5 を下回らない</text>

  <rect class="card" x="285" y="80" width="230" height="190" rx="14"/>
  <rect x="301" y="98" width="90" height="22" rx="11" fill="#2A9D91"/>
  <text class="badge" x="346" y="113" text-anchor="middle">口コミ件数</text>
  <text class="key" x="301" y="146">目標</text>
  <text class="big" x="301" y="192">30</text>
  <text class="unit" x="357" y="192">件以上</text>
  <line x1="301" y1="212" x2="499" y2="212" stroke="#E2D6C5" stroke-width="1.5"/>
  <text class="minl" x="301" y="238">最低ライン</text>
  <text class="minv" x="301" y="260">まず 10 件を超える</text>

  <rect class="card" x="530" y="80" width="230" height="190" rx="14"/>
  <rect x="546" y="98" width="66" height="22" rx="11" fill="#2A9D91"/>
  <text class="badge" x="579" y="113" text-anchor="middle">鮮度</text>
  <text class="key" x="546" y="146">目標</text>
  <text class="big" x="546" y="192">3</text>
  <text class="unit" x="580" y="192">ヶ月以内</text>
  <line x1="546" y1="212" x2="744" y2="212" stroke="#E2D6C5" stroke-width="1.5"/>
  <text class="minl" x="546" y="238">維持の目安</text>
  <text class="minv" x="546" y="260">月 2〜3 件の継続投稿</text>

  <text class="cap" x="40" y="306">出典: 株式会社FINEXT 独自調査（2026年3月・329名）／BrightLocal「Local Consumer Review Survey 2026」</text>
  <text class="cap" x="40" y="326">※ 数値は消費者が「信頼できる」と回答した水準にもとづく目安</text>
</svg>
