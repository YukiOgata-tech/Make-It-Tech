<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
  <title id="t">口コミ投稿画面にたどり着くまでの操作数</title>
  <desc id="d">口頭で案内した場合は6操作、QRコードは2操作、NFCは1操作で口コミ投稿画面に到達する。</desc>
  <style>
    .bg { fill: #F7F3EA; }
    .h { font: 600 25px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #1C2C34; }
    .rowl { font: 600 17px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #1C2C34; }
    .step { font: 400 12px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #5A6B73; }
    .cnt { font: 700 24px 'Outfit','Zen Kaku Gothic New',system-ui,sans-serif; fill: #1C2C34; }
    .cntu { font: 600 14px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #5A6B73; }
    .cap { font: 400 13px 'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; fill: #8A9299; }
    .track { stroke: #E2D6C5; stroke-width: 2; }
  </style>
  <rect class="bg" width="800" height="360" rx="18"/>
  <text class="h" x="40" y="52">口コミの投稿画面にたどり着くまでの操作数</text>

  <!-- 口頭 -->
  <text class="rowl" x="40" y="108">口頭でお願いする</text>
  <line class="track" x1="230" y1="102" x2="640" y2="102"/>
  <circle cx="230" cy="102" r="9" fill="#E2673D"/>
  <circle cx="312" cy="102" r="9" fill="#E2673D"/>
  <circle cx="394" cy="102" r="9" fill="#E2673D"/>
  <circle cx="476" cy="102" r="9" fill="#E2673D"/>
  <circle cx="558" cy="102" r="9" fill="#E2673D"/>
  <circle cx="640" cy="102" r="9" fill="#E2673D"/>
  <text class="step" x="230" y="128" text-anchor="middle">スマホを出す</text>
  <text class="step" x="312" y="128" text-anchor="middle">検索を開く</text>
  <text class="step" x="394" y="128" text-anchor="middle">店名を入力</text>
  <text class="step" x="476" y="128" text-anchor="middle">店を選ぶ</text>
  <text class="step" x="558" y="128" text-anchor="middle">口コミを探す</text>
  <text class="step" x="640" y="128" text-anchor="middle">投稿画面</text>
  <text class="cnt" x="700" y="110">6</text>
  <text class="cntu" x="724" y="110">操作</text>

  <!-- QR -->
  <text class="rowl" x="40" y="196">QRコード</text>
  <line class="track" x1="230" y1="190" x2="312" y2="190"/>
  <circle cx="230" cy="190" r="9" fill="#2A9D91"/>
  <circle cx="312" cy="190" r="9" fill="#2A9D91"/>
  <text class="step" x="230" y="216" text-anchor="middle">カメラを向ける</text>
  <text class="step" x="312" y="216" text-anchor="middle">投稿画面</text>
  <text class="cnt" x="700" y="198">2</text>
  <text class="cntu" x="724" y="198">操作</text>

  <!-- NFC -->
  <text class="rowl" x="40" y="284">NFC（かざす）</text>
  <circle cx="230" cy="278" r="9" fill="#2A9D91"/>
  <text class="step" x="230" y="304" text-anchor="middle">かざす＝投稿画面</text>
  <text class="cnt" x="700" y="286">1</text>
  <text class="cntu" x="724" y="286">操作</text>

  <text class="cap" x="40" y="340">操作が1つ増えるたびに離脱が起きる。導線の長さは、そのまま口コミの数に効く。</text>
</svg>
